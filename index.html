<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Binder TCG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <h1>Meu Binder</h1>
  <nav class="abas">
    <button class="aba ativa" data-aba="busca">Buscar</button>
    <button class="aba" data-aba="binder">Binder <span id="contador" class="contador">0</span></button>
  </nav>
</header>

<main>
  <section id="busca" class="painel ativo">
    <input id="campoBusca" type="search" placeholder="Nome (português ou inglês) ou número: 255/198" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="statusBusca" class="status">Digite pelo menos 2 caracteres.</p>
    <div id="resultados" class="resultados"></div>
  </section>

  <section id="binder" class="painel">
    <div class="controles">
      <div class="tamanhos">
        <button data-tam="2x2">2×2</button>
        <button data-tam="3x3">3×3</button>
        <button data-tam="4x3">4×3</button>
      </div>
      <div class="paginacao">
        <button id="ant" aria-label="Página anterior">‹</button>
        <span id="pagInfo">1 / 1</span>
        <button id="prox" aria-label="Próxima página">›</button>
      </div>
    </div>
    <div class="acoes">
      <button id="btnOrganizar" class="principal">Organizar</button>
      <button id="btnDesfazer" hidden>Desfazer</button>
      <button id="btnExportar">Exportar página</button>
      <button id="btnLimpar" class="perigo">Remover todas</button>
      <label class="chave-ia"><input type="checkbox" id="chkIA"> IA visual</label>
      <label class="chave-ia" title="Desligado = só visual: tipo e Pokémon não contam"><input type="checkbox" id="chkTema"> Usar tipo e Pokémon</label>
      <span id="flow" class="flow" title="Quanto as cartas desta página combinam entre si">Flow —</span>
    </div>
    <div id="flowDetalhe" class="flow-detalhe"></div>
    <p id="statusAnalise" class="status"></p>
    <p id="statusIA" class="status"></p>
    <div id="pagina" class="pagina"></div>
    <div id="barraSel" class="barra-sel" hidden>
      <span>Toque em outro espaço para mover</span>
      <button id="btnRemover" class="perigo">Remover</button>
      <button id="btnCancelar">Cancelar</button>
    </div>
  </section>
</main>

<div id="sugestao" class="folha" hidden>
  <div class="folha-caixa" role="dialog" aria-labelledby="sugTitulo">
    <div class="folha-topo">
      <strong id="sugTitulo">Sugestão para este espaço</strong>
      <button id="fecharSug" aria-label="Fechar">×</button>
    </div>
    <div id="sugCores" class="amostras"></div>
    <ul id="sugTexto" class="sug-texto"></ul>
    <button id="btnBuscarSug" class="btn-sug">Buscar cartas que combinem aqui</button>
    <p id="sugStatus" class="status"></p>
    <div id="sugCartas" class="resultados"></div>
  </div>
</div>

<div id="exportar" class="folha" hidden>
  <div class="folha-caixa" role="dialog" aria-labelledby="expTitulo">
    <div class="folha-topo">
      <strong id="expTitulo">Página para revisão</strong>
      <button id="fecharExp" aria-label="Fechar">×</button>
    </div>
    <img id="expImagem" class="exp-imagem" alt="Imagem da página do binder">
    <p class="status">Mande a imagem e o texto para o Claude pedir uma revisão da composição.</p>
    <textarea id="expTexto" class="exp-texto" readonly></textarea>
    <div class="exp-botoes">
      <button id="btnCompartilhar" class="btn-sug">Compartilhar imagem</button>
      <a id="lnkBaixar" class="btn-sec" download="pagina-binder.jpg">Baixar imagem</a>
      <button id="btnCopiar" class="btn-sec">Copiar texto</button>
    </div>
  </div>
</div>

<div id="aviso" class="aviso" role="status"></div>
<script src="analise.js"></script>
<script src="ia.js"></script>
<script src="app.js"></script>
</body>
</html>
