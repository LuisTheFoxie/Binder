<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Binder TCG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <h1>Meu Binder</h1>
  <nav class="abas">
    <button class="aba ativa" data-aba="busca">Buscar</button>
    <button class="aba" data-aba="binder">Binder <span id="contador" class="contador">0</span></button>
  </nav>
</header>

<main>
  <section id="busca" class="painel ativo">
    <input id="campoBusca" type="search" placeholder="Nome, código (sv3-125) ou OBF 125" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="statusBusca" class="status">Digite pelo menos 2 caracteres.</p>
    <div id="resultados" class="resultados"></div>
  </section>

  <section id="binder" class="painel">
    <div class="controles">
      <div class="tamanhos">
        <button data-tam="2x2">2×2</button>
        <button data-tam="3x3">3×3</button>
        <button data-tam="4x3">4×3</button>
      </div>
      <div class="paginacao">
        <button id="ant" aria-label="Página anterior">‹</button>
        <span id="pagInfo">1 / 1</span>
        <button id="prox" aria-label="Próxima página">›</button>
      </div>
    </div>
    <div class="acoes">
      <button id="btnOrganizar" class="principal">Organizar</button>
      <button id="btnDesfazer" hidden>Desfazer</button>
      <span id="flow" class="flow" title="Quanto as cartas desta página combinam entre si">Flow —</span>
    </div>
    <div id="pagina" class="pagina"></div>
    <div id="barraSel" class="barra-sel" hidden>
      <span>Toque em outro espaço para mover</span>
      <button id="btnRemover" class="perigo">Remover</button>
      <button id="btnCancelar">Cancelar</button>
    </div>
  </section>
</main>

<div id="aviso" class="aviso" role="status"></div>
<script src="analise.js"></script>
<script src="app.js"></script>
</body>
</html>
